version: "2"

linters:
  default: standard
  enable:
    - gocognit
    - gocyclo
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    gocognit:
      min-complexity: 15
    gocyclo:
      min-complexity: 15
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters:
          - gosec
          - gocognit

formatters:
  enable:
    - gofmt
    - goimports
